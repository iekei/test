<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - ページが見つかりません</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 100px;
            margin: 0;
            color: #e63946;
            font-weight: 900;
        }
        h2 {
            font-size: 24px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #6c757d;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .home-btn {
            display: inline-block;
            background-color: #1d3557;
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .home-btn:hover {
            background-color: #457b9d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>ページが見つかりません</h2>
        <p>お探しのページは建設中または、URLが変更されたため、見つけることができませんでした。<br>入力されたURLに間違いがないか再度ご確認ください。</p>
        <a href="/" class="home-btn">トップページへ戻る</a>
    </div>
</body>
</html>
